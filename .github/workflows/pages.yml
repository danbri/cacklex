name: Publish demo to gh-pages

# GitHub Pages for this repository is served from the gh-pages branch.
# Enabling the "GitHub Actions" publishing source needs an admin token,
# which the workflow token is not, so the site is published by pushing
# the assembled files to gh-pages instead.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'shapescore/js/shapes-core.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the mirror's tests
        working-directory: shapescore/js
        run: node --test
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp shapescore/js/shapes-core.mjs _site/
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish demo site from ${{ github.sha }}"

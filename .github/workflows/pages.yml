name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'shapescore/js/shapes-core.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the mirror's tests
        working-directory: shapescore/js
        run: node --test
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp shapescore/js/shapes-core.mjs _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
